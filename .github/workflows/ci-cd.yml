# Pipeline CI/CD de BiciSegura Lima (DevSecOps)
#  build -> pruebas (unitarias + integración con PostgreSQL) -> seguridad (secretos + dependencias) -> deploy
#  El análisis estático (SAST) corre en el workflow CodeQL.
#  PR hacia test o main: build, pruebas y seguridad. Push a main: además despliega en Azure App Service.
name: CI-CD

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Revisión de sintaxis
        run: npm run check

  pruebas:
    name: Pruebas automatizadas
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bicisegura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bicisegura_test
      JWT_SECRET: secreto-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias e integración con cobertura
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary
      - name: Publicar resultados en el resumen de la ejecución
        if: always()
        run: node scripts/resumen-pruebas.js >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            reports/
            coverage/
          retention-days: 7

  seguridad:
    name: Seguridad (secretos y dependencias)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Escaneo de secretos en todo el historial (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact -v
      - run: npm ci
      - name: Análisis de dependencias (falla con vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Despliegue en Azure App Service
    needs: [pruebas, seguridad]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Empaquetar solo dependencias de producción
        run: |
          npm ci --omit=dev
          zip -qr app.zip src db public node_modules package.json package-lock.json
      - name: Desplegar
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
      - name: Prueba de humo contra /health
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 10 --retry-all-errors \
            "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
