# SAST: análisis estático de seguridad del código con CodeQL (inyección SQL, XSS, rutas inseguras...).
# Los hallazgos aparecen en Security > Code scanning.
name: CodeQL
on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analizar:
    name: SAST (CodeQL JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
