<text x="30" y="40" style="font-size:24px;font-weight:700;fill:#1c1c1e">BiciSegura Lima · Arquitectura lógica</text>
<text x="30" y="64" class="s">Componentes del sistema y cómo se comunican (independiente del proveedor de nube)</text>

<!-- Usuarios -->
<rect class="capa" x="30" y="90" width="230" height="420" rx="14"/><text class="tit" x="48" y="116">USUARIOS</text>
<rect class="caja" x="50" y="140" width="190" height="80" rx="10"/><text class="h" x="66" y="172">Visitante</text><text class="s" x="66" y="194">consulta mapa, riesgo</text><text class="s" x="66" y="211">y estadísticas sin cuenta</text>
<rect class="caja" x="50" y="245" width="190" height="80" rx="10"/><text class="h" x="66" y="277">Ciclista registrado</text><text class="s" x="66" y="299">reporta, confirma o</text><text class="s" x="66" y="316">desmiente eventos</text>
<rect class="caja" x="50" y="350" width="190" height="80" rx="10"/><text class="h" x="66" y="382">Municipalidad</text><text class="s" x="66" y="404">(futuro, HU19)</text><text class="s" x="66" y="421">datos abiertos</text>

<!-- Frontend -->
<rect class="capa" x="300" y="90" width="330" height="420" rx="14"/><text class="tit" x="318" y="116">1 · FRONTEND (navegador / celular)</text>
<rect class="caja" x="320" y="140" width="290" height="110" rx="10"/><text class="h" x="336" y="170">App web HTML · CSS · JavaScript</text><text class="s" x="336" y="193">Vistas: Mapa · Riesgo · Estadísticas</text><text class="s" x="336" y="211">Reportar tocando el mapa · votar</text><text class="s" x="336" y="229">Filtros · diseño adaptable y modo oscuro</text>
<rect class="caja" x="320" y="268" width="290" height="80" rx="10"/><text class="h" x="336" y="298">Leaflet + leaflet.heat</text><text class="s" x="336" y="320">mapa interactivo y mapa de calor</text><text class="s" x="336" y="337">(servidos desde el propio dominio)</text>
<rect class="caja" x="320" y="366" width="290" height="124" rx="10"/><text class="h" x="336" y="396">“Cerca de mí” (HU15)</text><text class="s" x="336" y="418">distancia Haversine calculada</text><text class="s" x="336" y="436">en el navegador: la ubicación</text><text class="s" x="336" y="454">del ciclista nunca se envía</text><text class="s" x="336" y="472">al servidor (privacidad)</text>

<!-- API -->
<rect class="capa" x="680" y="90" width="520" height="560" rx="14"/><text class="tit" x="698" y="116">2 · BACKEND · API REST (Node.js 22 + Express 5)</text>
<rect class="seg" x="700" y="138" width="480" height="78" rx="10"/><text class="h" x="716" y="166" style="fill:#a5281b">Seguridad transversal (middleware)</text><text class="s" x="716" y="188">Helmet: CSP, HSTS, Referrer-Policy · límite 120 pet./min por IP</text><text class="s" x="716" y="205">validación de entradas · manejo de errores sin filtrar detalles</text>
<rect class="caja" x="700" y="234" width="150" height="120" rx="10"/><text class="h" x="714" y="262">/api/auth</text><text class="s" x="714" y="284">registro</text><text class="s" x="714" y="302">inicio de sesión</text><text class="s" x="714" y="320">20 intentos /</text><text class="s" x="714" y="338">15 min por IP</text>
<rect class="caja" x="865" y="234" width="150" height="120" rx="10"/><text class="h" x="879" y="262">/api/eventos</text><text class="s" x="879" y="284">mapa en vivo</text><text class="s" x="879" y="302">reportar · votar</text><text class="s" x="879" y="320">“ya no está”</text><text class="s" x="879" y="338">10 reportes/hora</text>
<rect class="caja" x="1030" y="234" width="150" height="120" rx="10"/><text class="h" x="1044" y="262">Estadísticas</text><text class="s" x="1044" y="284">historial calle</text><text class="s" x="1044" y="302">semáforo · panel</text><text class="s" x="1044" y="320">mapa de calor</text><text class="s" x="1044" y="338">solo verificados</text>
<rect class="caja" x="700" y="380" width="480" height="104" rx="10" style="fill:#eef5fc"/><text class="h" x="716" y="408">Reglas de dominio (funciones puras, con pruebas unitarias)</text><text class="s" x="716" y="430">3 confirmaciones de personas distintas = verificado · sin autovalidación</text><text class="s" x="716" y="448">1 voto por persona · vencimiento 24 h / 2 h / 3 votos según el tipo</text><text class="s" x="716" y="466">semáforo verde / amarillo / rojo · franja horaria · tendencia 30 días</text>
<rect class="caja" x="700" y="504" width="230" height="124" rx="10"/><text class="h" x="716" y="532">3 · Autenticación</text><text class="s" x="716" y="554">contraseña con bcrypt</text><text class="s" x="716" y="572">token JWT firmado (8 h)</text><text class="s" x="716" y="590">Authorization: Bearer</text><text class="s" x="716" y="608">error genérico al fallar</text>
<rect class="caja" x="950" y="504" width="230" height="124" rx="10"/><text class="h" x="966" y="532">Repositorio de datos</text><text class="s" x="966" y="554">consultas SQL</text><text class="s" x="966" y="572">parametrizadas ($1, $2)</text><text class="s" x="966" y="590">contra inyección SQL</text><text class="s" x="966" y="608">pool de conexiones</text>

<!-- Datos -->

<path d="M1290 160 a120 22 0 0 1 240 0 v180 a120 22 0 0 1 -240 0 z" fill="#fff" stroke="#1f4e79" stroke-width="2"/><path d="M1290 160 a120 22 0 0 0 240 0" fill="none" stroke="#1f4e79" stroke-width="2"/>
<text class="h" x="1318" y="214">PostgreSQL 16</text><text class="s" x="1318" y="238">usuarios · distritos</text><text class="s" x="1318" y="256">eventos · votos · cierres</text><text class="s" x="1318" y="280">PK (evento, usuario):</text><text class="s" x="1318" y="298">1 voto por persona</text><text class="s" x="1318" y="320">CHECK de tipos y</text><text class="s" x="1318" y="338">coordenadas en Lima</text>

<!-- Secretos y monitoreo -->
<rect class="capa" x="1250" y="420" width="320" height="230" rx="14"/><text class="tit" x="1268" y="446">SECRETOS Y MONITOREO</text>
<rect class="seg" x="1270" y="466" width="280" height="76" rx="10"/><text class="h" x="1286" y="494" style="fill:#a5281b">Gestor de secretos</text><text class="s" x="1286" y="516">DATABASE_URL · JWT_SECRET</text><text class="s" x="1286" y="532">leídos por identidad de la app</text>
<rect class="caja" x="1270" y="556" width="280" height="76" rx="10"/><text class="h" x="1286" y="584">Monitoreo (APM)</text><text class="s" x="1286" y="606">peticiones, errores, tiempos</text><text class="s" x="1286" y="622">alerta: más de 5 errores 5xx</text>

<rect class="ext" x="320" y="676" width="290" height="60" rx="10"/><text class="h" x="336" y="702">Geolocalización del navegador</text><text class="s" x="336" y="722">solo con permiso del usuario</text>

<text x="30" y="800" class="lb">Flujo de un reporte:</text>
<text x="30" y="824" class="s">1) El ciclista toca el mapa y elige “Robo”.  2) El frontend envía POST /api/eventos por HTTPS con su token JWT.  3) El middleware valida token, límite y datos.</text>
<text x="30" y="846" class="s">4) Las reglas de dominio verifican Lima y el límite de 10 reportes/hora.  5) El repositorio guarda con SQL parametrizado en PostgreSQL vía SSL.  6) Otros 3 ciclistas confirman</text>
<text x="30" y="868" class="s">(POST /votos): el evento pasa a verificado y desde entonces cuenta en el historial de la calle, el semáforo, el panel del distrito y el mapa de calor.</text>
<text x="30" y="910" class="lbs">Diagrama físico (Azure): App Service B1 Linux = API + frontend · PostgreSQL Flexible Server = base de datos · Key Vault = secretos · Application Insights = monitoreo · región Brazil South.</text>
